<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>手機台股看盤網頁</title>
    <!-- 引入 Tailwind CSS 打造手機響應式介面 -->
    <script src="https://jsdelivr.net"></script>
    <!-- 引入 金融級 TradingView K線圖套件 -->
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased select-none">

    <!-- 手機版上方導覽列 -->
    <header class="bg-gray-800 px-4 py-3 sticky top-0 z-50 shadow-md flex justify-between items-center border-b border-gray-700">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-bold tracking-wider text-amber-400">📊 台股行動看盤</span>
        </div>
        <div class="text-xs text-gray-400" id="update-time">載入中...</div>
    </header>

    <!-- 主體內容 -->
    <main class="p-4 space-y-4 max-w-md mx-auto pb-24">
        
        <!-- 股票報價卡片區區 -->
        <div class="bg-gray-800 p-5 rounded-2xl shadow-xl border border-gray-700">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold text-white flex items-center" id="stock-name">
                        載入中...
                    </h1>
                    <p class="text-gray-400 text-sm mt-0.5" id="stock-code-display">台股代號</p>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-medium bg-gray-700 text-gray-300">今日行情</span>
            </div>
            
            <div class="mt-6 flex justify-between items-baseline">
                <!-- 股價數字 -->
                <div class="text-4xl font-extrabold tracking-tight transition-all duration-300" id="stock-price">
                    --
                </div>
                <!-- 漲跌幅 -->
                <div class="text-lg font-bold px-3 py-1 rounded-xl transition-all duration-300" id="stock-change">
                    --
                </div>
            </div>

            <!-- 盤中詳細數據格 -->
            <div class="grid grid-cols-3 gap-2 mt-6 pt-4 border-t border-gray-700/50 text-center text-xs">
                <div class="bg-gray-950/40 p-2 rounded-lg">
                    <div class="text-gray-500 mb-1">開盤</div>
                    <div class="font-semibold text-gray-300" id="stock-open">--</div>
                </div>
                <div class="bg-gray-950/40 p-2 rounded-lg">
                    <div class="text-gray-500 mb-1">最高</div>
                    <div class="font-semibold text-gray-300" id="stock-high">--</div>
                </div>
                <div class="bg-gray-950/40 p-2 rounded-lg">
                    <div class="text-gray-500 mb-1">最低</div>
                    <div class="font-semibold text-gray-300" id="stock-low">--</div>
                </div>
            </div>
        </div>

        <!-- K線圖區塊 -->
        <div class="bg-gray-800 p-4 rounded-2xl shadow-xl border border-gray-700">
            <h3 class="text-sm font-semibold text-gray-400 mb-3 flex items-center">
                📈 走勢 K 線圖 <span class="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded ml-2">模擬歷史數據</span>
            </h3>
            <!-- TradingView 圖表容器 -->
            <div id="chart-container" class="w-full h-64 rounded-xl overflow-hidden bg-gray-950"></div>
        </div>
    </main>

    <script>
        // 目標查詢的台股代號（你可以自由修改這裡，例如：2454、2317）
        const targetStockCode = "2330"; 

        // 串接證交所官方 OpenAPI + 使用免費全來源 CORS 代理轉發
        const proxyUrl = "https://allorigins.win";
        const twseApiUrl = encodeURIComponent("https://twse.com.tw");

        // 核心功能：抓取真正的台股資料
        async function loadTaiwanStock() {
            try {
                const response = await fetch(`${proxyUrl}${twseApiUrl}`);
                if (!response.ok) throw new Error('網路請求失敗');
                
                const data = await response.json();
                // 解析代理伺服器傳回的字串內容
                const stockList = JSON.parse(data.contents);
                
                // 在全台股列表中找到我們指定的代號
                const myStock = stockList.find(item => item.Code === targetStockCode);
                
                if (myStock) {
                    // 1. 轉換並計算數據
                    const price = parseFloat(myStock.ClosingPrice);
                    const change = parseFloat(myStock.Change);
                    const open = parseFloat(myStock.OpeningPrice) || "--";
                    const high = parseFloat(myStock.HighestPrice) || "--";
                    const low = parseFloat(myStock.LowestPrice) || "--";
                    
                    // 2. 渲染文字到網頁畫面上
                    document.getElementById("stock-name").innerText = myStock.Name;
                    document.getElementById("stock-code-display").innerText = `台股 • ${myStock.Code}`;
                    document.getElementById("stock-price").innerText = `$${price.toFixed(2)}`;
                    document.getElementById("stock-open").innerText = open;
                    document.getElementById("stock-high").innerText = high;
                    document.getElementById("stock-low").innerText = low;
                    
                    // 3. 處理台股「紅漲綠跌」的顏色邏輯與正負號
                    const changeElement = document.getElementById("stock-change");
                    const priceElement = document.getElementById("stock-price");
                    
                    if (change > 0) {
                        changeElement.innerText = `▲ +${change.toFixed(2)}`;
                        changeElement.className = "text-lg font-bold px-3 py-1 rounded-xl bg-red-950/50 text-red-500 border border-red-500/30";
                        priceElement.className = "text-4xl font-extrabold tracking-tight text-red-500";
                    } else if (change < 0) {
                        changeElement.innerText = `▼ ${change.toFixed(2)}`;
                        changeElement.className = "text-lg font-bold px-3 py-1 rounded-xl bg-emerald-950/50 text-emerald-500 border border-emerald-500/30";
                        priceElement.className = "text-4xl font-extrabold tracking-tight text-emerald-500";
                    } else {
                        changeElement.innerText = `0.00`;
                        changeElement.className = "text-lg font-bold px-3 py-1 rounded-xl bg-gray-700/50 text-gray-400";
                        priceElement.className = "text-4xl font-extrabold tracking-tight text-gray-300";
                    }
                    
                    // 顯示更新時間
                    const now = new Date();
                    document.getElementById("update-time").innerText = `更新於 ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                    
                } else {
                    document.getElementById("stock-name").innerText = "代號錯誤";
                }
            } catch (error) {
                console.error("API 載入失敗:", error);
                document.getElementById("stock-name").innerText = "連線失敗";
            }
        }

        // 初始化 TradingView 模擬歷史 K 線圖表
        function initChart() {
            const chartContainer = document.getElementById('chart-container');
            const chart = LightweightCharts.createChart(chartContainer, {
                layout: { backgroundColor: '#090d16', textColor: '#6b7280' },
                grid: { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#374151' }
            });

            const candlestickSeries = chart.addCandlestickSeries({
                upColor: '#ef4444', downColor: '#10b981', // 台股紅漲綠跌
                borderUpColor: '#ef4444', borderDownColor: '#10b981',
                wickUpColor: '#ef4444', wickDownColor: '#10b981',
            });

            // 模擬一些歷史數據給K線圖呈現（證交所免費API不提供K線歷史，通常需要後端庫支援）
            const dummyData = [
                { time: '2026-10-05', open: 1020, high: 1035, low: 1015, close: 1030 },
                { time: '2026-10-06', open: 1030, high: 1045, low: 1025, close: 1040 },
                { time: '2026-10-07', open: 1040, high: 1040, low: 1010, close: 1015 },
                { time: '2026-10-08', open: 1015, high: 1030, low: 1015, close: 1025 },
                { time: '2026-10-09', open: 1025, high: 1050, low: 1025, close: 1045 },
            ];
            candlestickSeries.setData(dummyData);

            // 讓圖表隨手機螢幕大小自動縮放
            window.addEventListener('resize', () => {
                chart.resize(chartContainer.clientWidth, chartContainer.clientHeight);
            });
        }

        // 網頁載入時同步啟動
        window.onload = () => {
            loadTaiwanStock();
            initChart();
        };
    </script>
</body>
</html>
